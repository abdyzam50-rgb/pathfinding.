plugins {
    id 'fabric-loom' version '1.18.0-alpha.17'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Fabric maven is already included by loom; add any extra repos here
}

dependencies {
    // Minecraft + mappings
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings files('mappings/identity.jar')


    // Fabric Loader
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API (includes all sub-modules: commands, rendering, lifecycle, keybindings…)
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

java {
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
}

// The identity-mappings jar has no intermediary namespace, so source remapping fails.
// The compiled jar is not affected; disable the sources remap task.
tasks.matching { it.name == 'remapSourcesJar' }.configureEach { enabled = false }

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = Integer.parseInt(project.java_version)
}

jar {
    inputs.property 'archivesName', project.base.archivesName
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

processResources {
    inputs.property 'version', project.version
    filteringCharset 'UTF-8'

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

// Generate run configs so you can launch the game from IntelliJ / VS Code
loom {
    accessWidenerPath = file('src/main/resources/aotvpathfinder.accesswidener')
    runConfigs.client {
        ideConfigGenerated true
        runDir 'run'
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
